<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NFF Rogaland Kassebok</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316342E'/%3E%3Crect y='56' width='64' height='8' fill='%23A87A16'/%3E%3Cpath d='M14 31 32 16l18 15' fill='none' stroke='%23FFFDF7' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 28v20h26V28' fill='none' stroke='%23FFFDF7' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 44s-7-4.3-7-8.6a3.9 3.9 0 0 1 7-2.4 3.9 3.9 0 0 1 7 2.4C39 39.7 32 44 32 44z' fill='%23D4A84A'/%3E%3C/svg%3E">
<meta name="theme-color" content="#16342E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: kasserer-protokoll — sticky topp med år og faner, én kolonne innhold, tall i mono-kolonner */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e9edf2; --line:#d3dae3;
  --fg:#16202c; --muted:#5b6878;
  --ink:#2340a0; --ink-soft:#e3e9fb; --on-ink:#ffffff;
  --inn:#11734a; --inn-soft:#dff2e8; --ut:#b3362c; --ut-soft:#fbe6e3;
  --warn:#8a5a00; --warn-soft:#fdf0d2;
  --font-display:"Newsreader", Georgia, serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"Atkinson Hyperlegible", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface-2:#1f2833; --line:#2c3644;
  --fg:#e6ebf1; --muted:#9aa7b7;
  --ink:#8ea6ff; --ink-soft:#1f2a4d; --on-ink:#0f141b;
  --inn:#5fd29a; --inn-soft:#163527; --ut:#ff8b80; --ut-soft:#3d1d1a;
  --warn:#f1bf5a; --warn-soft:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1f2833; --line:#2c3644;
  --fg:#e6ebf1; --muted:#9aa7b7;
  --ink:#8ea6ff; --ink-soft:#1f2a4d; --on-ink:#0f141b;
  --inn:#5fd29a; --inn-soft:#163527; --ut:#ff8b80; --ut-soft:#3d1d1a;
  --warn:#f1bf5a; --warn-soft:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.top h1{font-size:1.15rem;flex:1;min-width:0}
.top h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:0}
.yearsel{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.yearsel select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--font-num)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink)}

main{padding-block:20px 120px;display:grid;gap:20px}
.section{display:grid;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem;max-width:62ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-family:var(--font-num);font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:.78rem;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--ut);border-color:var(--ut)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 20px rgba(10,20,40,.25);padding:12px 18px;border-radius:999px}

.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.inn{background:var(--inn-soft);color:var(--inn)}
.chip.ut{background:var(--ut-soft);color:var(--ut)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ink{background:var(--ink-soft);color:var(--ink)}

/* Kassebok */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.filters input{flex:1 1 180px}
.ledger{width:100%;border-collapse:collapse}
.ledger th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ledger tr.rowlink{cursor:pointer}
.ledger tr.rowlink:hover td{background:var(--surface-2)}
.ledger tr.reversed td{color:var(--muted)}
.ledger tr.reversed .desc{text-decoration:line-through}
.ledger .r{text-align:right}
.ledger .desc{min-width:0}
.ledger .meta{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.amt-inn{color:var(--inn)} .amt-ut{color:var(--ut)}
.tablewrap{overflow-x:auto}
@media (max-width:640px){
  .ledger thead{display:none}
  .ledger tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;padding:12px;border-bottom:1px solid var(--line)}
  .ledger td{border:0;padding:0}
  .ledger td.c-dato,.ledger td.c-kat{display:none}
  .ledger td.c-nr{grid-row:1/3}
  .ledger td.c-amt{grid-column:3;grid-row:1;text-align:right}
}
@media (min-width:641px){.m-only{display:none}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

/* Rapport-tabeller */
.rtable{width:100%;border-collapse:collapse}
.rtable th,.rtable td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.rtable th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.rtable .r{text-align:right}
.rtable tr.sum td{font-weight:600;border-top:2px solid var(--fg);border-bottom:0}
.rtable tr.grp td{background:var(--surface-2);font-weight:600;font-size:.85rem}
.rtable input{width:110px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--font-num)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar.over>i{background:var(--ut)}

.attn{display:grid;gap:8px}
.attn .item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem;flex-wrap:wrap}
.ok{padding:10px 14px;border-radius:8px;background:var(--inn-soft);color:var(--inn);font-size:.9rem}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.arr{display:grid;gap:10px}
.arr .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.arr .nums{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.arr .nums b{display:block;font-family:var(--font-num);font-weight:500;font-size:1rem;color:var(--fg)}

.field{display:grid;gap:4px}
.field label,.field .lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field textarea{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;padding:10px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].inn{background:var(--inn-soft);color:var(--inn)}
.seg button[aria-pressed="true"].ut{background:var(--ut-soft);color:var(--ut)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
@media (max-width:520px){.formgrid{grid-template-columns:1fr}}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,14,24,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.sheet dt{color:var(--muted);font-size:.85rem}
.sheet dd{margin:0;min-width:0;overflow-wrap:anywhere}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs a{display:grid;gap:4px;width:110px;font-size:.75rem;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.thumbs .t{width:110px;height:110px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-family:var(--font-num);color:var(--muted)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.notice{padding:10px 14px;border-radius:8px;background:var(--ink-soft);color:var(--ink);font-size:.88rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
.listedit{display:grid;gap:6px}
.listedit .li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.login{min-height:80vh;display:grid;place-items:center;padding-block:40px}
.login .card{width:100%;max-width:380px;display:grid;gap:14px;padding:24px}
.login h1{font-size:1.5rem}
.linkbtn{background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-size:.85rem;text-decoration:underline}
.loading{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Profil: samme stil som Samlingsplanleggeren (skoggrønn, gull, krem, Newsreader + Atkinson) ===== */
:root{
  --bg:#F3EFE5; --surface:#FFFDF7; --surface-2:#F7F3E9; --line:#E2DACA; --line-soft:#EDE6D6;
  --fg:#1A1F1C; --muted:#6F6A5E;
  --ink:#16342E; --ink-hover:#24544A; --ink-soft:#EDF3F0; --on-ink:#FFFDF7;
  --inn:#2E7D4F; --inn-soft:#EDF3F0; --ut:#9C3B28; --ut-soft:#FBEFEB;
  --warn:#8A6410; --warn-soft:#FDF6E8; --warn-line:#EAD9B4;
  --gold:#A87A16; --head:#16342E; --head-fg:#EFE9DA; --head-muted:#A9C4B9;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201C; --surface-2:#1F2924; --line:#2F3B35; --line-soft:#26312C;
  --fg:#EFE9DA; --muted:#A8AFA6;
  --ink:#A9C4B9; --ink-hover:#C3D8CF; --ink-soft:#1E2E28; --on-ink:#111613;
  --inn:#7FCB9C; --inn-soft:#18301F; --ut:#F09A86; --ut-soft:#3A1F19;
  --warn:#E7C26A; --warn-soft:#33291A; --warn-line:#5A4720;
  --gold:#D4A84A; --head:#0F2420; --head-fg:#EFE9DA; --head-muted:#A9C4B9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201C; --surface-2:#1F2924; --line:#2F3B35; --line-soft:#26312C;
  --fg:#EFE9DA; --muted:#A8AFA6;
  --ink:#A9C4B9; --ink-hover:#C3D8CF; --ink-soft:#1E2E28; --on-ink:#111613;
  --inn:#7FCB9C; --inn-soft:#18301F; --ut:#F09A86; --ut-soft:#3A1F19;
  --warn:#E7C26A; --warn-soft:#33291A; --warn-line:#5A4720;
  --gold:#D4A84A; --head:#0F2420; --head-fg:#EFE9DA; --head-muted:#A9C4B9; color-scheme:dark}

:focus-visible{outline:2px solid var(--gold)}
a{color:var(--ink)} a:hover{color:var(--gold)}
h1,h2,h3{font-weight:600;letter-spacing:-.015em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.hint{font-size:.9rem}
body::before{background:var(--head)}

/* Topp */
header.top{background:var(--head);color:var(--head-fg);border-bottom:3px solid var(--gold)}
.top .row1{padding-block:20px 10px;align-items:flex-end;gap:20px}
.top h1{display:flex;flex-direction:column-reverse;gap:4px;font-size:2rem;line-height:1.1;color:#FFFDF7}
.top h1 small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--head-muted)}
.yearsel{flex-direction:column;align-items:flex-start;gap:4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.yearsel select{background:transparent;border:0;border-bottom:1px solid rgba(239,233,218,.3);border-radius:0;color:#FFFDF7;font-family:var(--font-body);font-size:15px;letter-spacing:0;padding:3px 2px 5px;min-height:34px}
.yearsel select option{color:#1A1F1C;background:#FFFDF7}
.top #logout{background:transparent;color:var(--head-fg);border:1px solid rgba(239,233,218,.3)}
.top #logout:hover{background:rgba(239,233,218,.1)}
nav.tabs{gap:22px}
nav.tabs button{color:var(--head-muted);font-weight:700;font-size:15px;padding:10px 2px 12px;margin-bottom:-3px;border-bottom:3px solid transparent}
nav.tabs button:hover{color:#FFFDF7}
nav.tabs button[aria-selected="true"]{color:#FFFDF7;border-bottom-color:var(--gold)}

/* Flater */
main{padding-block:28px 120px;gap:22px}
.panel{border-color:var(--line);border-radius:16px}
.pad{padding:20px 22px}
.kpis{background:var(--line-soft);border-color:var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(26,31,28,.05),0 14px 34px rgba(26,31,28,.09)}
.kpi{padding:15px 18px}
.kpi .lbl{font-size:10.5px;letter-spacing:.11em;font-weight:700}
.kpi .val{font-family:var(--font-display);font-size:1.6rem;font-weight:600;line-height:1.15}
.kpi .sub{font-size:12px}

/* Knapper og merker */
.btn{border-radius:9px;font-weight:700;border-color:var(--line);min-height:40px}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--ink-hover);filter:none;color:var(--on-ink)}
.btn.danger{border-color:#E2CFC8}
.btn.danger:hover{background:var(--ut-soft);color:var(--ut)}
.btn.small{min-height:34px}
.fab{border-radius:999px;box-shadow:0 0 0 3px var(--gold),0 10px 26px rgba(26,31,28,.28)}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border:1px solid var(--line)}
.chip.inn{border-color:#A9C4B9} .chip.ut{border-color:#E2CFC8} .chip.warn{border-color:var(--warn-line)} .chip.ink{border-color:#A9C4B9}

/* Tabeller */
.ledger th,.rtable th{font-size:10.5px;letter-spacing:.11em;font-weight:700;background:var(--surface-2)}
.ledger td,.ledger th,.rtable td,.rtable th{border-bottom-color:var(--line-soft)}
.ledger tr.rowlink:hover td{background:var(--ink-soft)}
.rtable tr.grp td{background:var(--surface-2);font-family:var(--font-display);font-size:1rem}
.rtable tr.sum td{border-top-color:var(--ink)}
.rtable input{border-radius:8px}
.bar{height:8px;border-radius:999px;background:var(--line-soft)}
.bar>i{background:var(--ink);border-radius:999px}
@media (max-width:640px){.ledger tr{border-bottom-color:var(--line-soft)}}

/* Varsler */
.attn .item{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px}
.ok{background:var(--inn-soft);border:1px solid #A9C4B9;border-radius:12px}
.notice{border-radius:12px;border:1px solid #A9C4B9}
.notice.warn{border-color:var(--warn-line)}

/* Skjema */
.field input,.field select,.field textarea,.filters input,.filters select,.addrow input{border-radius:9px;border-color:var(--line);background:var(--surface)}
.listedit .li{border-radius:10px;background:var(--surface)}
.seg{border-radius:10px}

/* Dialoger og innlogging */
.overlay{background:rgba(15,28,24,.5)}
.sheet{background:var(--surface);border-top:3px solid var(--gold)}
.thumbs .t{border-radius:10px}
.toast{background:var(--head);color:#FFFDF7;border-radius:10px;border-bottom:2px solid var(--gold)}
.login{background:linear-gradient(var(--head) 0 220px,transparent 220px)}
.login .card{border-top:3px solid var(--gold);box-shadow:0 14px 34px rgba(26,31,28,.12)}
.login h1{font-size:2rem}
.linkbtn{color:var(--ink)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<section class="login wrap" id="login" hidden>
  <form class="panel card" id="loginForm" novalidate>
    <div><h1>Kassebok</h1><p class="hint">Norsk Fosterhjemsforening Rogaland. Kun for kasserer.</p></div>
    <div class="field"><label for="lEmail">E-post</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Passord</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <div id="lErr" class="notice warn" hidden></div>
    <button class="btn primary" id="lBtn">Logg inn</button>
    <button type="button" class="linkbtn" id="lReset">Glemt passord? Send lenke på e-post</button>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <h1 id="orgName">Kassebok<small id="orgSub">Norsk Fosterhjemsforening Rogaland</small></h1>
      <div class="yearsel"><label for="year">Regnskapsår</label><select id="year"></select></div>
      <button class="btn small" id="logout">Logg ut</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="main"><div class="loading">Henter regnskapet …</div></main>
<button class="btn primary fab" id="fab" hidden>+ Ny postering</button>
<div id="modal"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const TABS = [
  ["oversikt","Oversikt"],["kassebok","Kassebok"],["budsjett","Budsjett"],
  ["arrangementer","Arrangementer"],["rapport","Årsrapport"],["innstillinger","Innstillinger"]
];
const DEFAULTS = {
  navn: "Norsk Fosterhjemsforening Rogaland",
  orgnr: "",
  kategorier: {
    inn: ["Medlemskontingent refusjon/støtte NFF","Norsk Tipping (Grasrotandelen)","Kalendersalg","Kursinntekter / foredrag / aktiviteter","Diverse støtte","Diverse inntekter","Renteinntekter"],
    ut: ["Familiesamling / aktiviteter","Fosterhjemskafe","Fosterhjemskonferansen","Organisasjonssamling","Landsmøte / Ledersamling","Årsmøte","Styremøte","Styrehonorar","Politisk påvirkning / møter","Kurs","Reise / diett / kjøring – lokalt","Kontorrekvisita div.","Div. blomster / gaver","Bankgebyrer"]
  },
  arrangementer: ["Familiesamling 2026"],
  budsjett: {},
  saldo: {},
  avstemt: {},
  dokumenter: {}
};
const GJELD_KAT = "Betaling av gjeld fra tidligere år";
const UAVKLART = "Uavklart – må avklares";
const nf = new Intl.NumberFormat("nb-NO",{minimumFractionDigits:2,maximumFractionDigits:2});
const kr = n => nf.format(Math.round((n||0)*100)/100);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtDate = s => s ? s.split("-").reverse().join(".") : "";
const parseAmt = s => { const v = Number(String(s).replace(/\s|kr/gi,"").replace(",",".")); return isFinite(v) ? v : NaN; };
const $ = id => document.getElementById(id);

const S = { settings: structuredClone(DEFAULTS), hasSettings:false, rows: [], loaded:false,
  year: new Date().getFullYear(), tab: "oversikt", q:"", fKat:"", fArr:"", fBilag:"", editArr:null };
let db=null, assets=null, downloads=null, canWrite=true;

try { const t = localStorage.getItem("kb-tab"); if (t && TABS.some(x=>x[0]===t)) S.tab=t; } catch(e){}
if (location.hash && TABS.some(x=>x[0]===location.hash.slice(1))) S.tab = location.hash.slice(1);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }

/* ---------- Beregninger ---------- */
const yearRows = () => S.rows.filter(r=>r.aar===S.year);
const signed = r => r.type==="inn" ? r.belop : -r.belop;
// konto: "bank" | "kontant" | "gjeld" (kostnad satt av, ikke betalt ennå).
// GJELD_KAT: betaling av gjeld fra tidligere år, påvirker bank og gjeld, men ikke resultatet.
function sums(rows){
  let inn=0, ut=0, gjeld=0; const byKat={}, byKonto={bank:0,kontant:0};
  for (const r of rows){
    const sg = signed(r), konto = r.konto||"bank";
    if (r.kategori===GJELD_KAT){ byKonto[konto]=(byKonto[konto]||0)+sg; gjeld+=sg; continue; }
    if (r.type==="inn") inn+=r.belop; else ut+=r.belop;
    const k = r.type+"|"+r.kategori; byKat[k]=(byKat[k]||0)+r.belop;
    if (konto==="gjeld") gjeld-=sg; else byKonto[konto]=(byKonto[konto]||0)+sg;
  }
  return {inn, ut, res:inn-ut, byKat, byKonto, gjeld};
}
const saldo = y => ({bank:0, kontant:0, gjeld:0, ...(S.settings.saldo?.[y]||{})});
const budsjett = y => S.settings.budsjett?.[y] || {};
const missingBilag = rows => rows.filter(r=>!(r.bilag&&r.bilag.length) && !r.korrigerer && !r.bilagArkiv);
function nextNr(year){ return S.rows.filter(r=>r.aar===year).reduce((m,r)=>Math.max(m,r.nr||0),0)+1; }
function years(){
  const set = new Set([new Date().getFullYear(), S.year]);
  S.rows.forEach(r=>set.add(r.aar));
  Object.keys(S.settings.budsjett||{}).forEach(y=>set.add(+y));
  const max = Math.max(...set); set.add(max+1);
  return [...set].sort((a,b)=>b-a);
}

/* ---------- Lagring ---------- */
async function saveSettings(patch){
  if (!db) return toast("Lagring er ikke tilgjengelig her.");
  Object.assign(S.settings, patch);
  try {
    const ref = db.doc("regnskap/innstillinger");
    if (S.hasSettings) await ref.update(patch);
    else { await ref.set(S.settings); S.hasSettings=true; }
  } catch(e){ toast(writeErr(e)); }
}
function writeErr(e){
  if (e?.code==="invalid_argument" || e?.code==="permission-denied") return "Du har ikke tilgang til å endre regnskapet. Prøv å logge inn på nytt.";
  if (e?.code==="unavailable") return "Ingen nettforbindelse. Prøv igjen når du er på nett.";
  if (e?.code==="quota_exceeded") return "Lagringsplassen er full. Gi beskjed til Claude.";
  return "Kunne ikke lagre: " + (e?.message || "ukjent feil");
}

/* ---------- Render ---------- */
function renderChrome(){
  $("orgSub").textContent = S.settings.navn || "Forening";
  const ys = years();
  $("year").innerHTML = ys.map(y=>`<option value="${y}" ${y===S.year?"selected":""}>${y}</option>`).join("");
  $("tabs").innerHTML = TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  $("fab").hidden = !canWrite || !S.loaded;
}
function render(){
  renderChrome();
  if (!S.loaded) return;
  const m = $("main");
  const views = {oversikt:vOversikt, kassebok:vKassebok, budsjett:vBudsjett, arrangementer:vArr, rapport:vRapport, innstillinger:vInnst};
  m.innerHTML = views[S.tab]();
  bindView();
}

function ledgerRows(rows, compact){
  if (!rows.length) return "";
  return `<div class="tablewrap"><table class="ledger"><thead><tr><th>Bilag</th><th>Dato</th><th>Beskrivelse</th><th>Kategori</th><th class="r">Beløp</th></tr></thead><tbody>
  ${rows.map(r=>{
    const rev = !!r.korrigertAv;
    const chips = [
      r.arrangement ? `<span class="chip ink">${esc(r.arrangement)}</span>`:"",
      r.konto==="kontant" ? `<span class="chip">Kontant</span>`:"",
      r.korrigerer ? `<span class="chip">Korrigerer #${r.korrigerer}</span>`:"",
      rev ? `<span class="chip">Korrigert av #${r.korrigertAv}</span>`:"",
      r.kategori===UAVKLART ? `<span class="chip warn">Uavklart</span>`:"",
      r.kategori===GJELD_KAT ? `<span class="chip">Ikke kostnad i år</span>`:"",
      r.konto==="gjeld" ? `<span class="chip">Satt av, ikke betalt</span>`:"",
      r.belop<0 && !r.korrigerer && r.type==="ut" ? `<span class="chip inn">Refusjon/egenandel</span>`:"",
      r.belop<0 && !r.korrigerer && r.type==="inn" ? `<span class="chip">Reduserer inntekt</span>`:"",
      r.bilag?.length ? `<span class="chip">📎 ${r.bilag.length}</span>` : r.bilagArkiv ? `<span class="chip">${esc(r.bilagArkiv)}</span>` : !r.korrigerer ? `<span class="chip warn">Mangler bilag</span>` : ""
    ].join("");
    const sg = signed(r), amtCls = r.kategori===GJELD_KAT ? "" : sg>=0 ? "amt-inn" : "amt-ut";
    return `<tr class="rowlink ${rev?"reversed":""}" data-id="${esc(r.id)}" tabindex="0">
      <td class="c-nr num">#${r.nr}</td>
      <td class="c-dato num">${fmtDate(r.dato)}</td>
      <td class="desc"><div class="desc">${esc(r.beskrivelse)}</div><div class="meta"><span class="num m-only">${fmtDate(r.dato)}</span><span class="m-only">${esc(r.kategori)}</span>${chips}</div></td>
      <td class="c-kat">${esc(r.kategori)}</td>
      <td class="c-amt r num ${amtCls}">${sg>=0?"+":"−"} ${kr(Math.abs(sg))}</td>
    </tr>`;}).join("")}
  </tbody></table></div>`;
}

function vOversikt(){
  const rows = yearRows(), s = sums(rows), sal = saldo(S.year);
  const ib = (sal.bank||0)+(sal.kontant||0);
  const miss = missingBilag(rows);
  const unk = rows.filter(r=>r.kategori===UAVKLART);
  const b = budsjett(S.year);
  const over = Object.entries(b).filter(([k,v])=>v>0 && (s.byKat[k]||0)>v && k.startsWith("ut|"));
  const latest = [...rows].sort((a,b)=>b.nr-a.nr).slice(0,5);
  return `
  <section class="section">
    <div class="kpis">
      <div class="kpi"><span class="lbl">Inntekter ${S.year}</span><span class="val amt-inn">${kr(s.inn)}</span><span class="sub">${rows.length} posteringer i alt</span></div>
      <div class="kpi"><span class="lbl">Kostnader ${S.year}</span><span class="val amt-ut">${kr(s.ut)}</span><span class="sub">Etter refusjoner og egenandeler</span></div>
      <div class="kpi"><span class="lbl">Resultat</span><span class="val">${kr(s.res)}</span><span class="sub">${s.res>=0?"Overskudd":"Underskudd"}</span></div>
      <div class="kpi"><span class="lbl">Bank og kontanter</span><span class="val">${kr(ib+(s.byKonto.bank||0)+(s.byKonto.kontant||0))}</span><span class="sub">${(sal.gjeld+s.gjeld)?`Ubetalt gjeld ${kr(sal.gjeld+s.gjeld)}`:`Inngående ${kr(ib)}`}</span></div>
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Trenger oppmerksomhet</h2></div>
    <div class="attn">
      ${!S.hasSettings || (S.settings.saldo?.[S.year]==null) ? `<div class="item"><span>Inngående saldo for ${S.year} er ikke lagt inn. Bruk saldoen på kontoutskriften per 1. januar.</span><button class="btn small" data-go="innstillinger">Legg inn</button></div>`:""}
      ${unk.length ? `<div class="item"><span>${unk.length} postering${unk.length>1?"er":""} er uavklart. Beløpene i banken er riktige, men kategorien mangler.</span><button class="btn small" data-go="kassebok" data-fkat="${esc(UAVKLART)}">Vis</button></div>`:""}
      ${miss.length ? `<div class="item"><span>${miss.length} postering${miss.length>1?"er":""} mangler bilag. Revisor trenger kvittering eller faktura for hver.</span><button class="btn small" data-go="kassebok" data-fbilag="mangler">Vis</button></div>`:""}
      ${over.map(([k,v])=>`<div class="item"><span>${esc(k.split("|")[1])} er over budsjett: <span class="num">${kr(s.byKat[k])}</span> av <span class="num">${kr(v)}</span></span><button class="btn small" data-go="budsjett">Se budsjett</button></div>`).join("")}
      ${(S.settings.saldo?.[S.year]!=null && !miss.length && !over.length && !unk.length) ? `<div class="ok">Alt ser ryddig ut for ${S.year}. Alle posteringer har bilag.</div>`:""}
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Siste posteringer</h2>${rows.length?`<button class="btn small" data-go="kassebok">Hele kasseboka</button>`:""}</div>
    <div class="panel">${latest.length ? ledgerRows(latest,true) : emptyLedger()}</div>
  </section>`;
}
function emptyLedger(){
  return `<div class="empty"><strong>Ingen posteringer i ${S.year} ennå</strong><span>Hver inntekt og utgift føres som en postering med et bilag (kvittering, faktura eller kontoutskrift). Bilagene nummereres fortløpende fra #1 hvert år.</span>${canWrite?`<button class="btn primary" data-new>+ Før første postering</button>`:""}</div>`;
}

function filteredRows(){
  const q = S.q.trim().toLowerCase();
  return yearRows().filter(r=>{
    if (S.fKat && r.kategori!==S.fKat) return false;
    if (S.fArr && (S.fArr==="__ingen" ? r.arrangement : r.arrangement!==S.fArr)) return false;
    if (S.fBilag==="mangler" && ((r.bilag&&r.bilag.length) || r.korrigerer)) return false;
    if (q && !(`${r.nr} ${r.beskrivelse} ${r.kategori} ${r.arrangement||""} ${r.notat||""} ${kr(r.belop)}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>b.nr-a.nr);
}
function vKassebok(){
  const all = yearRows(); const rows = filteredRows(); const s = sums(rows);
  const kats = [...new Set([...S.settings.kategorier.inn, ...S.settings.kategorier.ut, GJELD_KAT, UAVKLART])];
  return `<section class="section">
    <div class="section-head"><h2>Kassebok ${S.year}</h2><span class="hint">${all.length} posteringer · ny får bilag #${nextNr(S.year)}</span></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Søk i beskrivelse, beløp, bilagsnr" value="${esc(S.q)}">
      <select id="fKat"><option value="">Alle kategorier</option>${kats.map(k=>`<option ${S.fKat===k?"selected":""}>${esc(k)}</option>`).join("")}</select>
      <select id="fArr"><option value="">Alle arrangementer</option><option value="__ingen" ${S.fArr==="__ingen"?"selected":""}>Uten arrangement</option>${arrFor(S.year, S.fArr).map(a=>`<option ${S.fArr===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
      <select id="fBilag"><option value="">Alle</option><option value="mangler" ${S.fBilag==="mangler"?"selected":""}>Mangler bilag</option></select>
    </div>
    <div class="panel">${all.length ? (rows.length ? ledgerRows(rows) : `<div class="empty">Ingen posteringer passer filteret.</div>`) : emptyLedger()}</div>
    ${rows.length ? `<div class="hint">Utvalg: inn <span class="num amt-inn">${kr(s.inn)}</span> · ut <span class="num amt-ut">${kr(s.ut)}</span> · netto <span class="num">${kr(s.res)}</span></div>`:""}
    <div class="hint">Posteringer kan ikke slettes. En feil rettes med «Korriger», som lager en motpostering slik at revisor ser hva som ble endret.</div>
  </section>`;
}

function vBudsjett(){
  const s = sums(yearRows()), b = budsjett(S.year);
  const block = (type, title) => {
    const kats = S.settings.kategorier[type];
    let tb=0, tf=0;
    const rows = kats.map(k=>{
      const key=type+"|"+k, bud=b[key]||0, fak=s.byKat[key]||0; tb+=bud; tf+=fak;
      const pct = bud>0 ? Math.min(100, fak/bud*100) : 0;
      const over = type==="ut" && bud>0 && fak>bud;
      return `<tr><td>${esc(k)}</td>
        <td class="r">${canWrite?`<input inputmode="decimal" data-bud="${esc(key)}" id="bud-${esc(key).replace(/\W/g,"_")}" value="${bud?kr(bud):""}" placeholder="0,00">`:`<span class="num">${kr(bud)}</span>`}</td>
        <td class="r num">${kr(fak)}</td>
        <td class="r num ${fak-bud<0&&type==="inn"||over?"amt-ut":""}">${kr(fak-bud)}</td>
        <td><div class="bar ${over?"over":""}"><i style="width:${pct}%"></i></div></td></tr>`;
    }).join("");
    return `<tr class="grp"><td colspan="5">${title}</td></tr>${rows}
      <tr class="sum"><td>Sum ${title.toLowerCase()}</td><td class="r num">${kr(tb)}</td><td class="r num">${kr(tf)}</td><td class="r num">${kr(tf-tb)}</td><td></td></tr>`;
  };
  const totB = Object.entries(b).reduce((m,[k,v])=>m+(k.startsWith("inn|")?v:-v),0);
  return `<section class="section">
    <div class="section-head"><h2>Budsjett mot faktisk ${S.year}</h2></div>
    <p class="hint">Skriv inn budsjettet slik årsmøtet vedtok det. Feltene lagres når du går ut av dem. Avvik viser faktisk minus budsjett.</p>
    <div class="panel tablewrap"><table class="rtable">
      <thead><tr><th>Post</th><th class="r">Budsjett</th><th class="r">Faktisk</th><th class="r">Avvik</th><th>Brukt</th></tr></thead>
      <tbody>${block("inn","Inntekter")}${block("ut","Utgifter")}
      <tr class="sum"><td>Budsjettert resultat / faktisk</td><td class="r num">${kr(totB)}</td><td class="r num">${kr(s.res)}</td><td class="r num">${kr(s.res-totB)}</td><td></td></tr>
      </tbody></table></div>
  </section>`;
}

function arrStats(name){
  const rows = yearRows().filter(r=>r.arrangement===name); const s=sums(rows);
  return {rows, ...s};
}
// Hvilket regnskapsår et arrangement hører til: lagret år, ellers året for første postering, ellers årstall i navnet.
function arrYear(a){
  const m = S.settings.arrAar?.[a]; if (m) return +m;
  const ys = S.rows.filter(r=>r.arrangement===a).map(r=>r.aar);
  if (ys.length) return Math.min(...ys);
  const t = String(a).match(/\b(19|20)\d{2}\b/); return t ? +t[0] : null;
}
// Arrangementer som skal vises for et år: hører til året, har posteringer i året, eller er allerede valgt.
function arrFor(y, keep){
  return S.settings.arrangementer.filter(a => a===keep || arrYear(a)===y || arrYear(a)==null || S.rows.some(r=>r.aar===y && r.arrangement===a));
}
function refreshArrOpts(){
  const sel=$("fArr2"), d=$("fDato"); if(!sel||!d) return;
  const y=+String(d.value).slice(0,4)||S.year, cur=sel.value;
  sel.innerHTML = `<option value="">Ingen</option>` + arrFor(y, cur).map(a=>`<option ${cur===a?"selected":""}>${esc(a)}</option>`).join("");
}
window.refreshArrOpts = refreshArrOpts;
async function saveArrEdit(old){
  const navn=$("eaNavn").value.trim(), aar=+$("eaAar").value;
  if (!navn) return toast("Arrangementet må ha et navn.");
  if (!(aar>=1990 && aar<=2100)) return toast("Skriv et gyldig år, f.eks. 2026.");
  if (navn!==old && S.settings.arrangementer.includes(navn)) return toast("Det finnes allerede et arrangement med det navnet.");
  if (!db) return toast("Lagring er ikke tilgjengelig her.");
  const brukt = S.rows.filter(r=>r.arrangement===old);
  $("eaYes").disabled=true;
  try {
    if (navn!==old && brukt.length){
      const tid=new Date().toISOString();
      for (let i=0;i<brukt.length;i+=400){
        const b=db.batch();
        for (const r of brukt.slice(i,i+400)) b.update(db.doc("posteringer/"+r.id), {arrangement:navn,
          endringer:[...(r.endringer||[]), {tid, tekst:`Arrangement omdøpt fra «${old}» til «${navn}»`}]});
        await b.commit();
      }
    }
    const arrAar={...(S.settings.arrAar||{})}; delete arrAar[old]; arrAar[navn]=aar;
    await saveSettings({arrangementer:S.settings.arrangementer.map(a=>a===old?navn:a), arrAar});
    if (S.fArr===old) S.fArr=navn;
    S.editArr=null; render();
    const vises = aar===S.year || S.rows.some(r=>r.aar===S.year && r.arrangement===navn);
    toast(vises ? `Arrangementet er lagret${brukt.length&&navn!==old?`, ${brukt.length} posteringer oppdatert`:""}.` : `«${navn}» er flyttet til ${aar}. Bytt regnskapsår øverst for å se det.`);
  } catch(e){ if($("eaYes")) $("eaYes").disabled=false; toast(writeErr(e)); }
}
function vArr(){
  const list = arrFor(S.year);
  const cards = list.map(a=>{
    const st = arrStats(a);
    if (S.editArr===a) return `<div class="panel pad arr">
      <h3>Rediger arrangement</h3>
      <div class="formgrid">
        <div class="field full"><label for="eaNavn">Navn</label><input id="eaNavn" value="${esc(a)}"></div>
        <div class="field"><label for="eaAar">Regnskapsår</label><input id="eaAar" type="number" inputmode="numeric" min="1990" max="2100" value="${arrYear(a)??S.year}"></div>
      </div>
      ${st.rows.length||S.rows.some(r=>r.arrangement===a)?`<p class="hint">Endrer du navnet, oppdateres alle ${S.rows.filter(r=>r.arrangement===a).length} posteringer som er knyttet til arrangementet. Endringen lagres i historikken til hver postering.</p>`:""}
      <div class="actions"><button class="btn" id="eaNo">Avbryt</button><button class="btn primary" id="eaYes">Lagre</button></div>
    </div>`;
    const kats = Object.entries(st.byKat).sort((x,y)=>x[0].localeCompare(y[0]));
    return `<div class="panel pad arr">
      <div class="head"><h3>${esc(a)}</h3><span class="chip ${st.res>=0?"inn":"ut"}">${st.res>=0?"Overskudd":"Underskudd"} <span class="num">${kr(st.res)}</span></span></div>
      <div class="nums"><span>Inntekter<b class="amt-inn">${kr(st.inn)}</b></span><span>Utgifter<b class="amt-ut">${kr(st.ut)}</b></span><span>Posteringer<b>${st.rows.length}</b></span></div>
      ${kats.length?`<table class="rtable"><tbody>${kats.map(([k,v])=>`<tr><td>${esc(k.split("|")[1])}</td><td class="r num ${k.startsWith("inn")?"amt-inn":"amt-ut"}">${k.startsWith("inn")?"+":"−"} ${kr(v)}</td></tr>`).join("")}</tbody></table>`:`<span class="hint">Ingen posteringer knyttet til dette arrangementet i ${S.year}.</span>`}
      ${st.rows.length||canWrite?`<div class="addrow" style="align-items:flex-start;align-self:end">${st.rows.length?`<button class="btn small" data-go="kassebok" data-farr="${esc(a)}">Vis posteringene</button>`:""}${canWrite?`<button class="btn small" data-editarr="${esc(a)}">Rediger</button>`:""}</div>`:""}
    </div>`;
  }).join("");
  return `<section class="section">
    <div class="section-head"><h2>Regnskap per arrangement ${S.year}</h2></div>
    <p class="hint">Knytt en postering til et arrangement når du fører den, så samles inntekter og kostnader her. Nyttig når dere skal rapportere tilbake til de som ga tilskudd.</p>
    <div class="grid2">${cards || `<div class="panel empty">Ingen arrangementer i ${S.year} ennå.</div>`}</div>
    ${canWrite?`<div class="panel pad"><div class="field"><label for="newArr">Legg til arrangement</label><div class="addrow"><input id="newArr" placeholder="F.eks. Juleavslutning ${S.year}"><button class="btn" id="addArr">Legg til</button></div></div></div>`:""}
  </section>`;
}

function reportData(){
  const rows = yearRows(), s = sums(rows), sal = saldo(S.year), b = budsjett(S.year);
  const ibBank = sal.bank||0, ibKont = sal.kontant||0, ibGjeld = sal.gjeld||0;
  const ubBank = ibBank + (s.byKonto.bank||0), ubKont = ibKont + (s.byKonto.kontant||0), ubGjeld = ibGjeld + s.gjeld;
  const avst = S.settings.avstemt?.[S.year];
  return {rows, s, b, ibBank, ibKont, ibGjeld, ubBank, ubKont, ubGjeld, avst};
}
function resultTable(d, forExport){
  const line = (type) => [...S.settings.kategorier[type], UAVKLART].map(k=>{
    const key=type+"|"+k, v=d.s.byKat[key]||0, bud=d.b[key]||0;
    if (!v && !bud) return "";
    return `<tr><td>${esc(k)}</td><td class="r num">${kr(v)}</td><td class="r num">${kr(bud)}</td></tr>`;
  }).join("");
  const tb = t => Object.entries(d.b).filter(([k])=>k.startsWith(t+"|")).reduce((m,[,v])=>m+v,0);
  return `<table class="rtable"><thead><tr><th>Resultatregnskap ${S.year}</th><th class="r">Regnskap</th><th class="r">Budsjett</th></tr></thead><tbody>
    <tr class="grp"><td colspan="3">Inntekter</td></tr>${line("inn") || `<tr><td colspan="3">Ingen inntekter ført</td></tr>`}
    <tr class="sum"><td>Sum inntekter</td><td class="r num">${kr(d.s.inn)}</td><td class="r num">${kr(tb("inn"))}</td></tr>
    <tr class="grp"><td colspan="3">Kostnader</td></tr>${line("ut") || `<tr><td colspan="3">Ingen kostnader ført</td></tr>`}
    <tr class="sum"><td>Sum kostnader</td><td class="r num">${kr(d.s.ut)}</td><td class="r num">${kr(tb("ut"))}</td></tr>
    <tr class="sum"><td>Årsresultat</td><td class="r num">${kr(d.s.res)}</td><td class="r num">${kr(tb("inn")-tb("ut"))}</td></tr>
  </tbody></table>`;
}
function balanceTable(d){
  const showK = d.ibKont || d.s.byKonto.kontant;
  const ibE = d.ibBank+d.ibKont, ubE = d.ubBank+d.ubKont, ibEK = ibE-d.ibGjeld, ubEK = ubE-d.ubGjeld;
  const row = (t,a,b,cls="") => `<tr class="${cls}"><td>${t}</td><td class="r num">${kr(a)}</td><td class="r num">${kr(b-a)}</td><td class="r num">${kr(b)}</td></tr>`;
  return `<table class="rtable"><thead><tr><th>Balanse</th><th class="r">1. januar</th><th class="r">Endring</th><th class="r">31. desember</th></tr></thead><tbody>
    ${row("Bankinnskudd", d.ibBank, d.ubBank)}
    ${showK?row("Kontanter", d.ibKont, d.ubKont):""}
    ${row("Sum eiendeler", ibE, ubE, "sum")}
    ${(d.ibGjeld||d.ubGjeld)?row("Kortsiktig gjeld (ubetalte kostnader)", d.ibGjeld, d.ubGjeld):""}
    ${row("Egenkapital", ibEK, ubEK, "sum")}
  </tbody></table>`;
}
function vRapport(){
  const d = reportData();
  const arrs = S.settings.arrangementer.map(a=>[a,arrStats(a)]).filter(([,x])=>x.rows.length);
  const diff = d.avst!=null ? Math.round((d.avst - d.ubBank)*100)/100 : null;
  const miss = missingBilag(d.rows).length;
  const docs = S.settings.dokumenter?.[S.year] || [];
  return `<section class="section">
    <div class="section-head"><h2>Årsrapport ${S.year}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="dlReport">Last ned årsrapport</button><button class="btn" id="openReport">Åpne for utskrift</button><button class="btn" id="dlCsv">Last ned kassebok (CSV)</button></div></div>
    <p class="hint">«Åpne for utskrift» viser rapporten i en ny fane der du velger Skriv ut → Lagre som PDF. Kasseboka lastes ned som en fil som åpnes i Excel. Bilagene ligger her og kan vises for revisor direkte fra hver postering.</p>
    ${miss?`<div class="notice warn">${miss} postering${miss>1?"er":""} mangler bilag. Revisor vil spørre etter disse.</div>`:""}
    <div class="panel tablewrap">${resultTable(d)}</div>
    <div class="panel tablewrap">${balanceTable(d)}</div>
    <div class="panel pad section">
      <h3>Avstemming mot bank</h3>
      <p class="hint">Skriv inn saldoen på kontoutskriften per 31. desember. Den skal være lik beregnet banksaldo. Et avvik betyr at noe mangler eller er ført feil.</p>
      <div class="addrow">${canWrite?`<input id="avst" inputmode="decimal" placeholder="Saldo på kontoutskrift" value="${d.avst!=null?kr(d.avst):""}">`:`<span class="num">${d.avst!=null?kr(d.avst):"Ikke lagt inn"}</span>`}</div>
      ${diff===null?"":diff===0?`<div class="ok">Stemmer med beregnet banksaldo <span class="num">${kr(d.ubBank)}</span>.</div>`:`<div class="notice warn">Avvik på <span class="num">${kr(diff)}</span> mot beregnet banksaldo <span class="num">${kr(d.ubBank)}</span>.</div>`}
    </div>
    <div class="panel pad section"><h3>Årsdokumenter ${S.year}</h3>
      <p class="hint">Revisjonsberetning, signert regnskap, protokoll fra årsmøtet og lignende.</p>
      ${docs.length?`<div class="listedit">${docs.map(x=>`<div class="li"><span>${esc(x.navn)}</span><button class="btn small" data-doc="${esc(x.id)}">Åpne</button></div>`).join("")}</div>`:`<span class="hint">Ingen dokumenter lagt ved for ${S.year}.</span>`}
      ${canWrite?`<div class="field"><label for="docUp">Legg til dokument</label><input id="docUp" type="file" multiple></div>`:""}
    </div>
    ${arrs.length?`<div class="panel tablewrap"><table class="rtable"><thead><tr><th>Arrangement</th><th class="r">Inntekter</th><th class="r">Kostnader</th><th class="r">Netto</th></tr></thead><tbody>${arrs.map(([a,x])=>`<tr><td>${esc(a)}</td><td class="r num">${kr(x.inn)}</td><td class="r num">${kr(x.ut)}</td><td class="r num">${kr(x.res)}</td></tr>`).join("")}</tbody></table></div>`:""}
  </section>`;
}

    ${canWrite?`<div class="addrow"><input id="nk-${type}" placeholder="Ny kategori"><button class="btn small" data-addkat="${type}">Legg til</button></div>`:""}</div>`;

  return `<section class="section">
    <h2>Innstillinger</h2>
    <div class="panel pad formgrid">
      <div class="field full"><label for="sNavn">Foreningens navn</label><input id="sNavn" value="${esc(st.navn)}" ${dis}></div>
      <div class="field"><label for="sOrg">Organisasjonsnummer</label><input id="sOrg" inputmode="numeric" value="${esc(st.orgnr)}" placeholder="9 siffer" ${dis}></div>
    </div>
    <div class="panel pad section">
      <h3>Inngående saldo 1. januar ${S.year}</h3>
      <p class="hint">Hent tallet fra kontoutskriften. Neste år kan du bruke utgående saldo fra årsrapporten.</p>
      <div class="formgrid">
        <div class="field"><label for="ibBank">Bankkonto</label><input id="ibBank" inputmode="decimal" value="${S.settings.saldo?.[S.year]!=null?kr(sal.bank):""}" placeholder="0,00" ${dis}></div>
        <div class="field"><label for="ibKont">Kontantkasse</label><input id="ibKont" inputmode="decimal" value="${S.settings.saldo?.[S.year]!=null?kr(sal.kontant):""}" placeholder="0,00" ${dis}></div>
        <div class="field full"><label for="ibGjeld">Ubetalte kostnader fra året før (kortsiktig gjeld)</label><input id="ibGjeld" inputmode="decimal" value="${S.settings.saldo?.[S.year]!=null?kr(sal.gjeld):""}" placeholder="0,00" ${dis}></div>
      </div>
      ${canWrite && S.settings.saldo?.[S.year]==null && S.year>Math.min(...years()) ? `<div><button class="btn small" id="carry">Hent utgående saldo fra ${S.year-1}</button></div>`:""}
    </div>
    <div class="grid2">
      <div class="panel pad section"><h3>Inntektskategorier</h3>${katList("inn")}</div>
      <div class="panel pad section"><h3>Utgiftskategorier</h3>${katList("ut")}</div>
    </div>
    <div class="panel pad section"><h3>Arrangementer ${S.year}</h3>
      <div class="listedit">${arrFor(S.year).map(a=>{ const i=st.arrangementer.indexOf(a); return `<div class="li"><span>${esc(a)}</span><span class="addrow" style="align-items:center">${canWrite?`<button class="btn small" data-editarr2="${esc(a)}">Rediger</button>`:""}${canWrite && !usedArr.has(a)?`<button class="btn small" data-rmarr="${i}">Fjern</button>`:`<span class="chip">I bruk</span>`}</span></div>`; }).join("") || `<span class="hint">Ingen arrangementer i ${S.year}.</span>`}</div>
    </div>
    <p class="hint">Kategorier og arrangementer som er brukt i en postering kan ikke fjernes, slik at gamle bilag fortsatt henger sammen.</p>

      <p class="hint">Legger inn et helt år fra en importfil, for eksempel et gammelt Excel-regnskap som Claude har gjort om. Du får se en oppsummering før noe lagres, og importen stopper hvis året allerede har posteringer.</p>
      <div class="field"><label for="impFile">Velg importfil (.json)</label><input id="impFile" type="file" accept=".json,application/json"></div></div>`:""}

      <p class="hint">Last ned hele regnskapet, alle år og alle bilagsfiler, som én fil. Ta en kopi etter årsoppgjøret og legg den i Dropbox. Bokføringsloven krever at regnskap og bilag oppbevares i minst fem år.</p>
      <div><button class="btn" id="backup">Last ned sikkerhetskopi</button></div></div>
  </section>`;
}

/* ---------- Hendelser ---------- */
function bindView(){
  const m=$("main");
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    S.fBilag = b.dataset.fbilag||""; S.fArr = b.dataset.farr||""; if (b.dataset.go==="kassebok"){S.fKat=b.dataset.fkat||"";S.q="";}
    setTab(b.dataset.go);
  });
  m.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>openForm());
  m.querySelectorAll("tr.rowlink").forEach(tr=>{
    tr.onclick=()=>openDetail(tr.dataset.id);
    tr.onkeydown=e=>{ if(e.key==="Enter") openDetail(tr.dataset.id); };
  });
  if (S.tab==="kassebok"){
    $("q").oninput=e=>{S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("q"); q.focus(); q.setSelectionRange(pos,pos);};
    $("fKat").onchange=e=>{S.fKat=e.target.value;render();};
    $("fArr").onchange=e=>{S.fArr=e.target.value;render();};
    $("fBilag").onchange=e=>{S.fBilag=e.target.value;render();};
  }
  if (S.tab==="budsjett") m.querySelectorAll("[data-bud]").forEach(inp=>inp.onchange=()=>{
    const v = inp.value.trim()==="" ? 0 : parseAmt(inp.value);
    if (isNaN(v)) return toast("Skriv beløpet som tall, f.eks. 12 500,00");
    const b = {...(S.settings.budsjett||{})}; b[S.year] = {...budsjett(S.year), [inp.dataset.bud]: v};
    saveSettings({budsjett:b}).then(()=>{render(); toast("Budsjett lagret");});
  });
  if (S.tab==="arrangementer" && $("addArr")) $("addArr").onclick=()=>{
    const v=$("newArr").value.trim(); if(!v) return;
    if (S.settings.arrangementer.includes(v)) return toast("Det arrangementet finnes allerede.");
    saveSettings({arrangementer:[...S.settings.arrangementer, v], arrAar:{...(S.settings.arrAar||{}), [v]:S.year}}).then(render);
  };
  if (S.tab==="arrangementer"){
    $("main").querySelectorAll("[data-editarr]").forEach(b=>b.onclick=()=>{ S.editArr=b.dataset.editarr; render(); const n=$("eaNavn"); if(n){n.focus(); n.select();} });
    if ($("eaNo")) $("eaNo").onclick=()=>{ S.editArr=null; render(); };
    if ($("eaYes")) $("eaYes").onclick=()=>saveArrEdit(S.editArr);
  }
  if (S.tab==="rapport"){
    $("main").querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{
      const x=(S.settings.dokumenter?.[S.year]||[]).find(z=>z.id===b.dataset.doc); if(x) openStored(x.id, x.navn, x.type);
    });
    if ($("docUp")) $("docUp").onchange=async e=>{
      const files=[...e.target.files]; if(!files.length) return;
      e.target.disabled=true; toast("Laster opp …");
      try{
        const nye = await uploadFiles(files, {any:true});
        const dk={...(S.settings.dokumenter||{})}; dk[S.year]=[...(dk[S.year]||[]), ...nye];
        await saveSettings({dokumenter:dk}); render(); toast("Dokument lagt til");
      }catch(ex){ e.target.disabled=false; toast(ex.__upload?ex.message:writeErr(ex)); }
    };
    $("dlReport").onclick=()=>downloadReport(false); $("openReport").onclick=()=>downloadReport(true); $("dlCsv").onclick=downloadCsv;
    if ($("avst")) $("avst").onchange=e=>{
      const v = e.target.value.trim()==="" ? null : parseAmt(e.target.value);
      if (Number.isNaN(v)) return toast("Skriv saldoen som tall.");
      const a={...(S.settings.avstemt||{})}; if (v===null) delete a[S.year]; else a[S.year]=v;
      saveSettings({avstemt:a}).then(render);
    };
  }
  if (S.tab==="innstillinger" && canWrite){
    $("sNavn").onchange=e=>saveSettings({navn:e.target.value.trim()||DEFAULTS.navn}).then(()=>{renderChrome();toast("Lagret");});
    $("sOrg").onchange=e=>saveSettings({orgnr:e.target.value.trim()}).then(()=>toast("Lagret"));
    const saveIB=()=>{
      const bank = $("ibBank").value.trim()===""?0:parseAmt($("ibBank").value);
      const kont = $("ibKont").value.trim()===""?0:parseAmt($("ibKont").value);
      const gj = $("ibGjeld").value.trim()===""?0:parseAmt($("ibGjeld").value);
      if (isNaN(bank)||isNaN(kont)||isNaN(gj)) return toast("Skriv saldoen som tall.");
      const sa={...(S.settings.saldo||{})}; sa[S.year]={bank,kontant:kont,gjeld:gj};
      saveSettings({saldo:sa}).then(()=>{render();toast("Inngående saldo lagret");});
    };
    $("backup").onclick=async()=>{
      const b=$("backup"); b.disabled=true; b.textContent="Henter alt …";
      try{
        const filer={};
        const metas=(await db.collection("filer").get()).docs;
        for (const m of metas){
          const biter=(await db.collection("filer/"+m.id+"/biter").get()).docs.sort((a,c)=>a.id.localeCompare(c.id)).map(d=>d.data().d).join("");
          filer[m.id]={...m.data(), data:biter};
        }
        const out={laget:new Date().toISOString(), innstillinger:S.settings, posteringer:S.rows, filer};
        await save(`nffr-regnskap-sikkerhetskopi-${today()}.json`, JSON.stringify(out));
      }catch(ex){ toast("Kunne ikke lage sikkerhetskopi: "+(ex.message||ex.code)); }
      b.disabled=false; b.textContent="Last ned sikkerhetskopi";
    };
    $("ibBank").onchange=saveIB; $("ibKont").onchange=saveIB; $("ibGjeld").onchange=saveIB;
    $("impFile").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) startImport(f); };
    if ($("carry")) $("carry").onclick=()=>{
      const y=S.year; S.year=y-1; const d=reportData(); S.year=y;
      const sa={...(S.settings.saldo||{})}; sa[y]={bank:Math.round(d.ubBank*100)/100,kontant:Math.round(d.ubKont*100)/100,gjeld:Math.round(d.ubGjeld*100)/100};
      saveSettings({saldo:sa}).then(()=>{render();toast(`Hentet utgående saldo fra ${y-1}`);});
    };
    $("main").querySelectorAll("[data-addkat]").forEach(b=>b.onclick=()=>{
      const t=b.dataset.addkat, v=$("nk-"+t).value.trim(); if(!v) return;
      if (S.settings.kategorier[t].includes(v)) return toast("Kategorien finnes allerede.");
      const k={...S.settings.kategorier,[t]:[...S.settings.kategorier[t],v]};
      saveSettings({kategorier:k}).then(render);
    });
    $("main").querySelectorAll("[data-rmkat]").forEach(b=>b.onclick=()=>{
      const [t,i]=b.dataset.rmkat.split("|"); const arr=[...S.settings.kategorier[t]]; arr.splice(+i,1);
      saveSettings({kategorier:{...S.settings.kategorier,[t]:arr}}).then(render);
    });
    $("main").querySelectorAll("[data-rmarr]").forEach(b=>b.onclick=()=>{
      const arr=[...S.settings.arrangementer]; arr.splice(+b.dataset.rmarr,1);
      saveSettings({arrangementer:arr}).then(render);
    });
    $("main").querySelectorAll("[data-editarr2]").forEach(b=>b.onclick=()=>{ S.editArr=b.dataset.editarr2; setTab("arrangementer"); const n=$("eaNavn"); if(n){n.focus(); n.select();} });
  }
}
function setTab(t){ S.tab=t; try{localStorage.setItem("kb-tab",t);}catch(e){} render(); window.scrollTo(0,0); }
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) setTab(b.dataset.tab); });
$("year").onchange=e=>{ S.year=+e.target.value; S.editArr=null; render(); };
$("fab").onclick=()=>openForm();

function closeModal(){ $("modal").innerHTML=""; document.body.style.overflow=""; if(S.loaded) render(); }
function modal(html){
  $("modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow="hidden";
  $("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); });
}

function openForm(pre){
  if (!canWrite) return;
  let p = pre || {type:"ut", dato: (S.year===new Date().getFullYear()? today() : `${S.year}-12-31`), konto:"bank"};
  if (p.belop<0 && p.type==="ut") p = {...p, type:"inn", refKat:p.kategori, belop:-p.belop};
  let type = p.type;
  const opt = (v,label,sel) => `<option value="${esc(v)}" ${sel?"selected":""}>${esc(label)}</option>`;
  const katOpts = t => {
    const main = S.settings.kategorier[t].map(k=>opt(k,k,p.kategori===k && !p.refKat)).join("");
    const vet = `<optgroup label="Vet ikke ennå">${opt(UAVKLART,UAVKLART,p.kategori===UAVKLART)}</optgroup>`;
    if (t==="inn") return main + `<optgroup label="Refusjon eller egenandel (trekkes fra en kostnad)">${S.settings.kategorier.ut.map(k=>opt("ref|"+k,k,p.refKat===k)).join("")}</optgroup>` + vet;
    return main + `<optgroup label="Ikke en kostnad i år">${opt(GJELD_KAT,GJELD_KAT,p.kategori===GJELD_KAT)}</optgroup>` + vet;
  };
  modal(`
    <h2>${pre?.korrFra?`Riktig postering etter korreksjon av #${pre.korrFra}`:"Ny postering"}</h2>
    <div class="seg" role="group" aria-label="Type">
      <button type="button" class="inn" data-t="inn" aria-pressed="${type==="inn"}">Inntekt</button>
      <button type="button" class="ut" data-t="ut" aria-pressed="${type==="ut"}">Utgift</button>
    </div>
    <form id="pf" class="formgrid" novalidate>
      <div class="field"><label for="fDato">Dato</label><input id="fDato" type="date" value="${esc(p.dato)}" onchange="refreshArrOpts()" required></div>
      <div class="field"><label for="fBelop">Beløp (kr)</label><input id="fBelop" inputmode="decimal" placeholder="0,00" value="${p.belop?kr(p.belop):""}" required></div>
      <div class="field full"><label for="fBesk">Beskrivelse</label><input id="fBesk" placeholder="F.eks. Leie av Stemnestaden, faktura 1042" value="${esc(p.beskrivelse||"")}" required></div>
      <div class="field"><label for="fKat">Kategori</label><select id="fKat">${katOpts(type)}</select></div>
      <div class="field"><label for="fArr2">Arrangement</label><select id="fArr2"><option value="">Ingen</option>${arrFor(+String(p.dato||"").slice(0,4)||S.year, p.arrangement).map(a=>`<option ${p.arrangement===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      <div class="field"><label for="fKonto">Betalt via</label><select id="fKonto"><option value="bank" ${!p.konto||p.konto==="bank"?"selected":""}>Bankkonto</option><option value="kontant" ${p.konto==="kontant"?"selected":""}>Kontanter</option><option value="gjeld" ${p.konto==="gjeld"?"selected":""}>Ikke betalt ennå (settes av som gjeld)</option></select></div>
      <div class="field"><label for="fFiler">Bilag (kvittering, faktura)</label><input id="fFiler" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple ${assets?"":"disabled"}></div>

      <div class="field full"><label for="fNotat">Notat (valgfritt)</label><textarea id="fNotat" placeholder="Hvem betalte, hva gjelder det, vedtak i styret …">${esc(p.notat||"")}</textarea></div>

    if (kat===GJELD_KAT && rtype!=="ut") return err("Betaling av gammel gjeld føres som utgift.");

      if (aar!==S.year){ S.year=aar; render(); }
    }catch(ex){ $("fSave").disabled=false; $("fSave").textContent="Lagre postering"; err(ex.__upload ? ex.message : writeErr(ex)); }
  };
  setTimeout(()=>$("fBelop").focus(),50);
}
async function uploadFiles(files, opts){
  const out=[];
  for (const f of files){
    try{ const r = await assets.upload(f, opts); out.push({id:r.id, navn:f.name, type:r.contentType}); }
    catch(e){
      const m = e?.code==="unsupported_type" ? `«${f.name}» har et filformat som ikke støttes. Bruk JPG, PNG eller PDF.` :
        e?.code==="too_large" || /large|size/i.test(e?.message||"") ? `«${f.name}» er for stor (maks 20 MB).` :
        `Kunne ikke laste opp «${f.name}»: ${e?.message||"ukjent feil"}`;
      const er=new Error(m); er.__upload=true; throw er;
    }
  }
  return out;
}

const CHUNK = 700000; // tegn base64 per bit, under Firestores grense på 1 MB per dokument
const MAX_BYTES = 8*1024*1024;
const urlCache = {};

async function shrinkImage(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 400*1024) return file;
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}
function toB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
async function storeB64(b64, meta){
  const ref = db.collection("filer").doc();
  const n = Math.max(1, Math.ceil(b64.length/CHUNK));
  for (let i=0;i<n;i++) await ref.collection("biter").doc(String(i).padStart(3,"0")).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)});
  await ref.set({...meta, biter:n, lastetOpp:new Date().toISOString()});
  return ref.id;
}
assets = {
  async upload(file, opts={}){
    if (!opts.any && !/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type)) throw {code:"unsupported_type"};
    const f = opts.any ? file : await shrinkImage(file);
    if (f.size > MAX_BYTES) throw {code:"too_large", message:"for stor"};
    const type = f.type || "application/octet-stream";
    const id = await storeB64(await toB64(f), {navn:f.name, type, storrelse:f.size});
    return {id, contentType:type};
  }
};
async function openStored(id, navn, type){
  const visning = /^(image\/|application\/pdf)/.test(type||"");
  const w = visning ? window.open("","_blank") : null;
  try{
    const u = await fileUrl(id);
    if (visning){ if (w) w.location=u; else location.href=u; }
    else { const a=document.createElement("a"); a.href=u; a.download=navn||"dokument"; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if (w) w.close(); toast("Kunne ikke åpne filen."); }
}

    for (const p of d.posteringer){
      if (!Number.isInteger(p.nr) || p.nr<1) return `Ugyldig bilagsnummer: ${p.nr}`;
      if (seen.has(p.nr)) return `Bilagsnummer ${p.nr} finnes to ganger i filen`;
      seen.add(p.nr);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(p.dato||"") || +p.dato.slice(0,4)!==y) return `Bilag ${p.nr} har dato utenfor ${y}`;
      if (!["inn","ut"].includes(p.type) || typeof p.belop!=="number" || !p.kategori) return `Bilag ${p.nr} mangler type, beløp eller kategori`;
    }
    return "";
  })();
  const finnes = S.rows.filter(r=>r.aar===y).length;
  const rows = d.posteringer.map(p=>({...p, aar:y}));
  const s = sums(rows), ib = {bank:0,kontant:0,gjeld:0,...(d.saldo||{})};
  const ubBank = ib.bank + (s.byKonto.bank||0), ubGjeld = ib.gjeld + s.gjeld;
  const nrs = rows.map(r=>r.nr);
  const kan = !problem && !finnes;
  modal(`
    <h2>Importer regnskap for ${y}</h2>
    ${d.kilde?`<p class="hint">Kilde: ${esc(d.kilde)}</p>`:""}
    ${problem?`<div class="notice warn">Filen har en feil og kan ikke importeres: ${esc(problem)}.</div>`:""}
    ${finnes?`<div class="notice warn">${y} har allerede ${finnes} posteringer. Importen er stoppet for å unngå at noe blir ført to ganger.</div>`:""}
    <dl>
      <dt>Posteringer</dt><dd class="num">${rows.length} (bilag ${Math.min(...nrs)}–${Math.max(...nrs)})</dd>
      <dt>Inntekter</dt><dd class="num">${kr(s.inn)}</dd>
      <dt>Kostnader</dt><dd class="num">${kr(s.ut)}</dd>
      <dt>Årsresultat</dt><dd class="num">${kr(s.res)}</dd>
      <dt>Bank 1. januar</dt><dd class="num">${kr(ib.bank)}</dd>
      <dt>Bank etter siste postering</dt><dd class="num">${kr(ubBank)}${d.avstemt!=null?(Math.abs(d.avstemt-ubBank)<0.005?" · stemmer med kontoutskrift":" · avvik mot kontoutskrift "+kr(d.avstemt-ubBank)):""}${d.kontroll?(Math.abs(d.kontroll.belop-ubBank)<0.005?` · stemmer med ${esc(d.kontroll.tekst)}`:` · avvik mot ${esc(d.kontroll.tekst)}: ${kr(d.kontroll.belop-ubBank)}`):""}</dd>
      <dt>Ubetalt gjeld</dt><dd class="num">${kr(ubGjeld)}</dd>
      ${rows.some(r=>r.kategori===UAVKLART)?`<dt>Uavklart</dt><dd>${rows.filter(r=>r.kategori===UAVKLART).length} posteringer må få kategori senere</dd>`:""}
      <dt>Budsjett</dt><dd>${d.budsjett?Object.keys(d.budsjett).length+" poster":"Ingen"}</dd>
      <dt>Årsdokumenter</dt><dd>${(d.dokumenter||[]).map(x=>esc(x.navn)).join(", ")||"Ingen"}</dd>
    </dl>
    <p class="hint">Kategorilisten byttes til den i filen. Kategorier som allerede er brukt i andre år beholdes.</p>
    <div id="impMsg" class="notice" hidden></div>
    <div class="actions"><button class="btn" id="impNo">Avbryt</button>${kan?`<button class="btn primary" id="impYes">Importer ${rows.length} posteringer</button>`:""}</div>`);
  $("impNo").onclick=closeModal;
  if (!kan) return;
  $("impYes").onclick=async()=>{
    const msg = t => { $("impMsg").textContent=t; $("impMsg").hidden=false; };
    $("impYes").disabled=true; $("impNo").disabled=true;
    try{
      const nyeDok=[];
      for (const x of (d.dokumenter||[])){
        msg(`Laster opp ${x.navn} …`);
        const id = await storeB64(x.data, {navn:x.navn, type:x.type, storrelse:x.storrelse||0});
        nyeDok.push({id, navn:x.navn, type:x.type});
      }
      msg("Lagrer posteringer …");
      const now = new Date().toISOString();
      for (let i=0;i<rows.length;i+=400){
        const batch = db.batch();
        for (const p of rows.slice(i,i+400)){
          const id = `${y}-${String(p.nr).padStart(4,"0")}`;
          batch.set(db.doc("posteringer/"+id), {nr:p.nr, aar:y, dato:p.dato, type:p.type, belop:Math.round(p.belop*100)/100,
            beskrivelse:p.beskrivelse||"", kategori:p.kategori, arrangement:p.arrangement||"", konto:p.konto||"bank",
            notat:p.notat||"", bilag:[], bilagArkiv:p.bilagArkiv||"", importert:d.kilde||"Importfil", opprettet:now});
        }
        await batch.commit();
      }
      msg("Oppdaterer innstillinger …");
      const brukt = t => S.rows.filter(r=>r.type===t && r.aar!==y).map(r=>r.kategori);
      const spes = k => k!==GJELD_KAT && k!==UAVKLART;
      const kat = {inn:[...new Set([...(d.kategorier?.inn||S.settings.kategorier.inn), ...brukt("inn")].filter(spes))],
                   ut:[...new Set([...(d.kategorier?.ut||S.settings.kategorier.ut), ...brukt("ut")].filter(spes))]};
      const patch = {kategorier:kat, arrangementer:[...new Set([...S.settings.arrangementer, ...(d.arrangementer||[])])],
        arrAar:{...Object.fromEntries((d.arrangementer||[]).map(a=>[a,y])), ...(S.settings.arrAar||{})},
        saldo:{...(S.settings.saldo||{}), [y]:ib}};
      if (d.budsjett) patch.budsjett = {...(S.settings.budsjett||{}), [y]:d.budsjett};
      if (d.avstemt!=null) patch.avstemt = {...(S.settings.avstemt||{}), [y]:d.avstemt};
      if (nyeDok.length) patch.dokumenter = {...(S.settings.dokumenter||{}), [y]:[...(S.settings.dokumenter?.[y]||[]), ...nyeDok]};
      await saveSettings(patch);
      S.year = y; closeModal(); setTab("oversikt"); toast(`${rows.length} posteringer importert til ${y}`);
    }catch(ex){ msg("Importen stoppet: "+writeErr(ex)+" Ta kontakt før du prøver igjen, så vi ikke får doble posteringer."); }
  };
}
async function fileUrl(id){
  if (urlCache[id]) return urlCache[id];
  const meta = (await db.doc("filer/"+id).get()).data();
  if (!meta) throw new Error("mangler");
  const parts = (await db.collection("filer/"+id+"/biter").get()).docs.sort((a,b)=>a.id.localeCompare(b.id)).map(d=>d.data().d).join("");
  const bin = atob(parts), arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return urlCache[id] = URL.createObjectURL(new Blob([arr],{type:meta.type}));
}
downloads = {
  async save({filename, data}){
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data])); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    return {status:"saved"};
  }
};

/* ---------- Innlogging ---------- */
const loginMsg = m => { $("lErr").textContent=m; $("lErr").hidden=!m; };
$("loginForm").onsubmit = async e=>{
  e.preventDefault(); loginMsg("");
  const email=$("lEmail").value.trim(), pass=$("lPass").value;
  if (!email || !pass) return loginMsg("Fyll inn e-post og passord.");
  $("lBtn").disabled=true;
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(ex){
    loginMsg(/invalid|wrong|not-found|credential/.test(ex.code||"") ? "Feil e-post eller passord." :
      ex.code==="auth/too-many-requests" ? "For mange forsøk. Vent litt og prøv igjen." : "Kunne ikke logge inn: "+(ex.message||ex.code));
  }
  $("lBtn").disabled=false;
};
$("lReset").onclick = async ()=>{
  const email=$("lEmail").value.trim();
  if (!email) return loginMsg("Skriv inn e-postadressen først.");
  try{ await auth.sendPasswordResetEmail(email); loginMsg("Hvis adressen har tilgang, er det sendt en lenke for nytt passord."); }
  catch(ex){ loginMsg("Hvis adressen har tilgang, er det sendt en lenke for nytt passord."); }
};
$("logout").onclick = ()=>auth.signOut();

let unsubs = [];
auth.onAuthStateChanged(user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  $("login").hidden = !!user; $("app").hidden = !user;
  if (!user){ S.loaded=false; S.rows=[]; closeModal(); return; }
  render();
  let gotS=false, gotR=false;
  const ready=()=>{ if(gotS&&gotR){ S.loaded=true; render(); } };
  const denied = e => { $("main").innerHTML=`<div class="panel empty"><strong>Ingen tilgang</strong><span>${e.code==="permission-denied"?"Denne kontoen har ikke tilgang til regnskapet.":esc(e.message)}</span><button class="btn" onclick="firebase.auth().signOut()">Logg ut</button></div>`; };
  unsubs.push(db.doc("regnskap/innstillinger").onSnapshot(snap=>{
    const d = snap.data();
    if (d){ S.settings = {...structuredClone(DEFAULTS), ...d, kategorier:{...DEFAULTS.kategorier, ...(d.kategorier||{})}}; S.hasSettings=true; }
    gotS=true; if(S.loaded) render(); else ready();
  }, denied));
  unsubs.push(db.collection("posteringer").onSnapshot(snap=>{
    S.rows = snap.docs.map(d=>({id:d.id, ...d.data()}));
    gotR=true; if(S.loaded && !$("modal").innerHTML) render(); else if(S.loaded) renderChrome(); else ready();
  }, denied));
});
})();
